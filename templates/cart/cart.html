<!DOCTYPE html>
<html>
<head>
    <title>My Cart</title>
</head>
<body>

<h1>My Cart</h1>

{% for item in cart_items %}

    <h3>{{ item.book.title }}</h3>

    <p>
        Price: ₹{{ item.book.price }}
    </p>

   <p>

    <a href="{% url 'decrease_quantity' item.id %}">
        -
    </a>

    {{ item.quantity }}

    <a href="{% url 'increase_quantity' item.id %}">
        +
    </a>

</p>
<a href="{% url 'remove_from_cart' item.id %}">
    Remove
</a>

    <p>
    Subtotal:
    ₹{{ item.subtotal }}
</p>

    <hr>

{% empty %}

    <p>Your cart is empty.</p>

{% endfor %}

<h2>Total: ₹{{ total }}</h2>

<a href="{% url 'checkout' %}">
    <button>
        Checkout
    </button>
</a>

</body>
</html>
