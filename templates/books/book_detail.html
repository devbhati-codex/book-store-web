<!DOCTYPE html>
<html>
<head>
    <title>{{ book.title }}</title>
</head>
<body>

<h1>{{ book.title }}</h1>

<img
    src="{{ book.image.url }}"
    width="250"
>

<p>
    Author:
    {{ book.author }}
</p>

<p>
    Category:
    {{ book.category }}
</p>

<p>
    Price:
    ₹{{ book.price }}
</p>

<p>
    Stock:
    {{ book.stock }}
</p>

<p>
    {{ book.description }}
</p>

<button>
    Add To Cart
</button>

</body>
</html>
