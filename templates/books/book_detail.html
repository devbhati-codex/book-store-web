<!DOCTYPE html>
<html>
<head>
    <title>{{ book.title }}</title>
</head>
<body>

<img
    src="{{ book.image.url }}"
    width="250"
>

<p>
    Author:
    {{ book.author }}
</p>

<p>
    Category:
    {{ book.category }}
</p>

<p>
    Price:
    ₹{{ book.price }}
</p>

<p>
    Stock:
    {{ book.stock }}
</p>

<p>
    {{ book.description }}
</p>

<a href="{% url 'add_to_cart' book.id %}">
    <button>
        Add To Cart
    </button>
</a>

</body>
</html>
