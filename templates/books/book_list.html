<!DOCTYPE html>
<html>
<head>
    <title>Books</title>
</head>
<body>

<h1>All Books</h1>

{% for book in books %}

    <h3><a href="{% url 'book_detail' book.slug %}">
    {{ book.title }}
</a></h3>

    <p>{{ book.author }}</p>

    <p>₹{{ book.price }}</p>

    <hr>

{% empty %}

    <p>No books found.</p>

{% endfor %}

</body>
</html>
