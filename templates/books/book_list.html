    {% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">

    <h1>
        📚 Explore Books
    </h1>

    <span class="text-muted">
        {{ books|length }} Books Found
    </span>

</div>

<form method="GET" class="row g-3 mb-4">

    <div class="col-md-8">

        <input
            type="text"
            class="form-control"
            name="q"
            value="{{ query }}"
            placeholder="Search books, authors..."
        >

    </div>

    <div class="col-md-4">

        <select
            class="form-select"
             name="category"
             onchange="window.location='?category=' + this.value"
            >

            <option value="">
                   All Categories
            </option>

            {% for category in categories %}

            <option
                value="{{ category.id }}"
                 {% if request.GET.category == category.id|stringformat:"s" %}
                     selected
                 {% endif %}
                >
                  {{ category.name }}
            </option>

                {% endfor %}

        </select>

    </div>

</form>

<div class="row">

    {% for book in books %}

    <div class="col-6 col-md-4 col-lg-3 mb-4">

        <div class="book-card h-100">

            <img
                src="{{ book.image.url }}"
                alt="{{ book.title }}"
                class="book-image"
            >

            <div class="mt-3">

                <span class="badge bg-light text-dark mb-2">
                    {{ book.category }}
                </span>

                <h5>
                    {{ book.title }}
                </h5>

                <p class="text-muted mb-2">
                    {{ book.author }}
                </p>

                <h5 class="text-primary">
                    ₹{{ book.price }}
                </h5>

                <a
                    href="{% url 'book_detail' book.slug %}"
                    class="btn btn-primary w-100"
                >
                    View Details
                </a>

            </div>

        </div>

    </div>

    {% empty %}

    <div class="col-12">

        <div class="alert alert-warning text-center">

            No books found.

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
>
